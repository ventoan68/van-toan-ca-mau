    <radialGradient id="light" cx="72%" cy="20%" r="55%"><stop offset="0" stop-color="#ffffff" stop-opacity=".45"/><stop offset=".42" stop-color="#fb923c" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
